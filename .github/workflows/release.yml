# Builds the Windows host + extension bundle and attaches it to a GitHub Release.
#
#   * manual run : Actions -> release -> Run workflow
#   * tag run    : git tag v0.3.0 && git push origin v0.3.0
#
# A single, permanently-installable .xpi requires Mozilla signing. Add these
# repository secrets to enable it:
#     AMO_JWT_ISSUER   (looks like user:12345:67)
#     AMO_JWT_SECRET   (long hex string)
# Get them at https://addons.mozilla.org/developers/addon/api/key/
# Without the secrets the workflow still builds a bundle, but the .xpi inside
# only loads temporarily via about:debugging, and Firefox auto-update is off.
#
# The release body comes from docs/releases/v<version>.md -- the same document
# the bundle ships as RELEASE-NOTES.md and `ytgrab update` prints.
#
# If the version's release already has assets (for example a bundle that was
# built and signed locally, then published with `gh release create` + `gh
# release upload`), the workflow exits early instead of rebuilding over it.

name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if the release already has assets
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          $assets = gh release view $tag --json assets -q '.assets[].name' 2>$null
          if ($LASTEXITCODE -eq 0 -and $assets -and "$assets" -ne "[]") {
            Write-Host "release $tag already has assets - skipping the build"
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "release $tag has no assets - building"
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - uses: actions/setup-python@v5
        if: steps.existing.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          node-version: "20"

      - name: Read the version
        id: version
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version = $v"

      - name: Build host and bundle
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if ($env:AMO_JWT_ISSUER -and $env:AMO_JWT_SECRET) {
            Write-Host "AMO credentials found - building a signed bundle"
            ./scripts/make_release.ps1 -Sign
          } else {
            Write-Host "no AMO credentials - building an unsigned bundle"
            ./scripts/make_release.ps1
          }

      - uses: actions/upload-artifact@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          name: ytgrab-windows
          path: |
            release/*.zip
            release/SHA256SUMS.txt
            release/*.xpi
            release/updates.json

      - name: Attach the bundle to the release
        if: startsWith(github.ref, 'refs/tags/') && steps.existing.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/v${{ steps.version.outputs.version }}.md
          files: |
            release/*.zip
            release/SHA256SUMS.txt
            release/ytgrab-*.xpi
            release/updates.json

      - name: Refresh the Firefox update manifest on main
        if: startsWith(github.ref, 'refs/tags/') && steps.existing.outputs.skip != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path release/updates.json)) {
            Write-Host "no release/updates.json (unsigned build) - skipping"
            exit 0
          }
          git fetch origin main
          git checkout -B main origin/main
          Copy-Item release/updates.json docs/updates.json -Force
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/updates.json
          if (git diff --cached --quiet) {
            Write-Host "docs/updates.json already current"
            exit 0
          }
          git commit -m "chore: update manifest for v${{ steps.version.outputs.version }}"
          git push origin main